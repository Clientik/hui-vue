name: Release

# The run is titled after the version it publishes, so the Actions list reads
# as a list of releases rather than a list of commits.
run-name: Release ${{ inputs.version || github.event.release.tag_name || github.ref_name }}

on:
  # Only a tagged version publishes: ordinary commits never queue a run.
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. v1.1.0
        required: false

# Pages deployments are serialised: a queued run waits rather than cancelling
# the one in flight, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs import the CLI's built schema, so the CLI has to exist first.
      - run: pnpm --filter hui-kit build

      - name: Generate static site
        run: pnpm --filter v4 generate
        env:
          DEPLOY_TARGET: github-pages
          NODE_OPTIONS: --max-old-space-size=8192

      # Pages has to be switched on for the repository first (Settings -> Pages
      # -> Source: GitHub Actions). The built-in token cannot create the site
      # itself, so `enablement` only turns a clear failure into a confusing one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/v4/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
