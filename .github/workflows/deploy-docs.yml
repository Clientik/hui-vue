name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployments are serialised: a queued run waits rather than cancelling
# the one in flight, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs import the CLI's built schema, so the CLI has to exist first.
      - run: pnpm --filter hui-kit build

      - name: Generate static site
        run: pnpm --filter v4 generate
        env:
          DEPLOY_TARGET: github-pages
          NODE_OPTIONS: --max-old-space-size=8192

      # enablement turns Pages on for the repository if it is not yet enabled,
      # so a fresh clone of this repo deploys without a manual settings visit.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/v4/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
